<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#141f36" />
      <stop offset="100%" stop-color="#081b29" />
    </linearGradient>
    <linearGradient id="sc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00eeff" />
    </linearGradient>
    <filter id="sc-glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#sc-bg)"/>
  <circle cx="500" cy="70" r="130" fill="#6366f1" opacity="0.14" filter="blur(35px)"/>
  <circle cx="90" cy="260" r="110" fill="#00eeff" opacity="0.12" filter="blur(30px)"/>

  <!-- School Portal Window Mockup -->
  <g transform="translate(100, 35)">
    <rect width="400" height="270" rx="14" fill="#112239" stroke="#00eeff" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Topbar -->
    <rect width="400" height="36" rx="14" fill="#061622" />
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" />
    <text x="70" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#00eeff">School Portal &amp; Academic Management</text>

    <!-- Cap Icon -->
    <g transform="translate(350, 10)">
      <polygon points="12,2 24,7 12,12 0,7" fill="#00eeff" filter="url(#sc-glow)" />
      <path d="M4,10 L4,17 C4,20 20,20 20,17 L20,10" fill="none" stroke="#00eeff" stroke-width="1.5"/>
    </g>

    <!-- Stat 1: Total Enrolled -->
    <rect x="20" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#1f3b58" stroke-width="1"/>
    <text x="28" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Students Enrolled</text>
    <text x="28" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#00eeff">1,420</text>
    <text x="28" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#10b981">● Active Term</text>

    <!-- Stat 2: Teachers & Staff -->
    <rect x="145" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#1f3b58" stroke-width="1"/>
    <text x="153" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Teachers &amp; Staff</text>
    <text x="153" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">78</text>
    <text x="153" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#38bdf8">● 32 Classes</text>

    <!-- Stat 3: Attendance Rate -->
    <rect x="270" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#1f3b58" stroke-width="1"/>
    <text x="278" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Attendance Rate</text>
    <text x="278" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#a855f7">97.8%</text>
    <text x="278" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#10b981">▲ +2.1% this week</text>

    <!-- Student Gradebook & Courses Mockup -->
    <rect x="20" y="130" width="360" height="120" rx="8" fill="#081b29" />
    <rect x="20" y="130" width="360" height="26" rx="8" fill="#0c2333" />
    <text x="32" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Course / Subject</text>
    <text x="160" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Grade Level</text>
    <text x="250" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Avg Score</text>
    <text x="320" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Status</text>

    <!-- Row 1 -->
    <text x="32" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Computer Science 101</text>
    <text x="160" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Grade 11 - A</text>
    <text x="250" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#00eeff">92.4%</text>
    <rect x="316" y="163" width="50" height="15" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="324" y="174" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#10b981">Pass (A)</text>

    <!-- Row 2 -->
    <text x="32" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Advanced Mathematics</text>
    <text x="160" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Grade 11 - B</text>
    <text x="250" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#00eeff">88.6%</text>
    <rect x="316" y="191" width="50" height="15" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="324" y="202" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#10b981">Pass (B+)</text>

    <!-- Row 3 -->
    <text x="32" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Web Application Design</text>
    <text x="160" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Grade 12 - A</text>
    <text x="250" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#00eeff">95.0%</text>
    <rect x="316" y="219" width="50" height="15" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="324" y="230" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#10b981">Pass (A+)</text>
  </g>
</svg>
