<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b29" />
      <stop offset="50%" stop-color="#0e2f3d" />
      <stop offset="100%" stop-color="#062227" />
    </linearGradient>
    <linearGradient id="ph-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00eeff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="ph-glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#ph-bg)"/>
  <circle cx="480" cy="80" r="130" fill="#00eeff" opacity="0.12" filter="blur(35px)"/>
  <circle cx="120" cy="260" r="100" fill="#10b981" opacity="0.12" filter="blur(30px)"/>

  <!-- Pharmacy Dashboard Window -->
  <g transform="translate(100, 35)">
    <rect width="400" height="270" rx="14" fill="#0e2a3b" stroke="#00eeff" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Topbar -->
    <rect width="400" height="36" rx="14" fill="#061622" />
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" />
    <text x="70" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#00eeff">Pharmacy Inventory &amp; POS System</text>

    <!-- Medical Cross Badge -->
    <g transform="translate(340, 7)" filter="url(#ph-glow)">
      <circle cx="11" cy="11" r="10" fill="#10b981" />
      <rect x="9" y="5" width="4" height="12" fill="#fff" rx="1"/>
      <rect x="5" y="9" width="12" height="4" fill="#fff" rx="1"/>
    </g>

    <!-- Stat 1: Total Medicines -->
    <rect x="20" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#1b3f54" stroke-width="1"/>
    <text x="28" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Medicines In Stock</text>
    <text x="28" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#00eeff">2,480</text>
    <text x="28" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#10b981">● 98% Available</text>

    <!-- Stat 2: Daily Sales -->
    <rect x="145" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#1b3f54" stroke-width="1"/>
    <text x="153" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Today's Sales</text>
    <text x="153" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">14,290 ETB</text>
    <text x="153" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#38bdf8">● 142 Invoices</text>

    <!-- Stat 3: Expiring Alert -->
    <rect x="270" y="52" width="110" height="65" rx="8" fill="#081b29" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
    <text x="278" y="70" font-family="'Poppins', sans-serif" font-size="9" fill="#f87171">Expiring Items</text>
    <text x="278" y="95" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#f87171">12</text>
    <text x="278" y="110" font-family="'Poppins', sans-serif" font-size="8" fill="#f87171">⚠ Needs Review</text>

    <!-- Prescription Table Mockup -->
    <rect x="20" y="130" width="360" height="120" rx="8" fill="#081b29" />
    <rect x="20" y="130" width="360" height="26" rx="8" fill="#0c2333" />
    <text x="32" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Medicine Name</text>
    <text x="160" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Category</text>
    <text x="250" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Qty</text>
    <text x="320" y="147" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#00eeff">Status</text>

    <!-- Row 1 -->
    <text x="32" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Amoxicillin 500mg</text>
    <text x="160" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Antibiotic</text>
    <text x="250" y="174" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">240</text>
    <rect x="316" y="163" width="50" height="15" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="324" y="174" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#10b981">In Stock</text>

    <!-- Row 2 -->
    <text x="32" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Paracetamol 500mg</text>
    <text x="160" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Analgesic</text>
    <text x="250" y="202" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">650</text>
    <rect x="316" y="191" width="50" height="15" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="324" y="202" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#10b981">In Stock</text>

    <!-- Row 3 -->
    <text x="32" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">Azithromycin 250mg</text>
    <text x="160" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#94a3b8">Antibiotic</text>
    <text x="250" y="230" font-family="'Poppins', sans-serif" font-size="9" fill="#ededed">15</text>
    <rect x="316" y="219" width="50" height="15" rx="4" fill="#f59e0b" opacity="0.2"/>
    <text x="324" y="230" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#f59e0b">Low Qty</text>
  </g>
</svg>
